      .table { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .head { fill: #f0f0f0; stroke: #111111; stroke-width: 1.5; }
      .head-text { font: 700 15px Arial, sans-serif; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .field { font: 12px Arial, sans-serif; fill: #111111; dominant-baseline: middle; }
      .pk { font-weight: 700; }
      .line { stroke: #111111; stroke-width: 2; fill: none; }
      .dot { fill: #111111; }
    </style>
