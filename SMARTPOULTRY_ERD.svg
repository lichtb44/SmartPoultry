<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">SMARTPOULTRY Entity Relationship Diagram</title>
  <desc id="desc">Entity relationship diagram for the SMARTPOULTRY website database models.</desc>
  <defs>
    <style>
