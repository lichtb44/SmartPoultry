<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram of SMARTPOULTRY</title>
  <desc id="desc">A UML-style use case diagram for SMARTPOULTRY with User and Admin actors connected to system use cases.</desc>
  <defs>
    <style>
      .page { fill: #ffffff; }
      .system-box { fill: #f7f7f7; stroke: #111111; stroke-width: 3; }
      .system-title { font: 700 34px "Times New Roman", serif; fill: #111111; text-anchor: middle; }
      .usecase { fill: #08720f; stroke: #064d0a; stroke-width: 2; }
      .usecase-text { font: 700 15px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .actor-line { stroke: #111111; stroke-width: 3; stroke-linecap: round; fill: none; }
      .connector { stroke: #111111; stroke-width: 2; fill: none; }
      .actor-label { font: 700 20px "Times New Roman", serif; fill: #111111; text-anchor: middle; }
      .caption { font: 700 24px "Times New Roman", serif; fill: #111111; text-anchor: middle; }
      .caption-underline { text-decoration: underline; }
    </style>
  </defs>

  <rect class="page" width="1000" height="1000"/>

  <rect x="320" y="70" width="360" height="780" class="system-box"/>
  <text x="500" y="118" class="system-title">SMARTPOULTRY</text>

  <g id="user-actor">
    <circle cx="165" cy="430" r="16" class="actor-line"/>
    <line x1="165" y1="446" x2="165" y2="510" class="actor-line"/>
    <line x1="132" y1="475" x2="198" y2="475" class="actor-line"/>
    <line x1="165" y1="510" x2="135" y2="560" class="actor-line"/>
    <line x1="165" y1="510" x2="195" y2="560" class="actor-line"/>
    <text x="165" y="595" class="actor-label">User</text>
  </g>

  <g id="admin-actor">
    <circle cx="835" cy="430" r="16" class="actor-line"/>
    <line x1="835" y1="446" x2="835" y2="510" class="actor-line"/>
    <line x1="802" y1="475" x2="868" y2="475" class="actor-line"/>
    <line x1="835" y1="510" x2="805" y2="560" class="actor-line"/>
    <line x1="835" y1="510" x2="865" y2="560" class="actor-line"/>
    <text x="835" y="595" class="actor-label">Admin</text>
  </g>

  <g id="use-cases">
    <ellipse id="uc-register" cx="500" cy="150" rx="105" ry="22" class="usecase"/>
    <text x="500" y="150" class="usecase-text">Process Registration</text>

    <ellipse id="uc-login" cx="500" cy="198" rx="105" ry="22" class="usecase"/>
    <text x="500" y="198" class="usecase-text">Process Login</text>

    <ellipse id="uc-dashboard" cx="500" cy="246" rx="105" ry="22" class="usecase"/>
    <text x="500" y="246" class="usecase-text">View Dashboard</text>

    <ellipse id="uc-flocks" cx="500" cy="294" rx="105" ry="22" class="usecase"/>
    <text x="500" y="294" class="usecase-text">Manage Flocks</text>

    <ellipse id="uc-inventory" cx="500" cy="342" rx="105" ry="22" class="usecase"/>
    <text x="500" y="342" class="usecase-text">Manage Inventory</text>

    <ellipse id="uc-revenue" cx="500" cy="390" rx="105" ry="22" class="usecase"/>
    <text x="500" y="390" class="usecase-text">Manage Revenue</text>

    <ellipse id="uc-expenses" cx="500" cy="438" rx="105" ry="22" class="usecase"/>
    <text x="500" y="438" class="usecase-text">Manage Expenses</text>

    <ellipse id="uc-analytics" cx="500" cy="486" rx="105" ry="22" class="usecase"/>
    <text x="500" y="486" class="usecase-text">View Predictions</text>

    <ellipse id="uc-reports" cx="500" cy="534" rx="105" ry="22" class="usecase"/>
    <text x="500" y="534" class="usecase-text">Generate Reports</text>

    <ellipse id="uc-profile" cx="500" cy="582" rx="105" ry="22" class="usecase"/>
    <text x="500" y="582" class="usecase-text">Manage Profile</text>

    <ellipse id="uc-settings" cx="500" cy="630" rx="105" ry="22" class="usecase"/>
    <text x="500" y="630" class="usecase-text">Manage Settings</text>

    <ellipse id="uc-notifications" cx="500" cy="678" rx="105" ry="22" class="usecase"/>
    <text x="500" y="678" class="usecase-text">View Notifications</text>

    <ellipse id="uc-users" cx="500" cy="726" rx="105" ry="22" class="usecase"/>
    <text x="500" y="726" class="usecase-text">Manage Users</text>

    <ellipse id="uc-feedback" cx="500" cy="774" rx="105" ry="22" class="usecase"/>
    <text x="500" y="774" class="usecase-text">Manage Feedback</text>
  </g>

  <g id="user-connectors">
    <line x1="198" y1="475" x2="395" y2="150" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="246" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="294" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="342" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="390" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="438" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="486" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="534" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="582" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="630" class="connector"/>
    <line x1="198" y1="475" x2="395" y2="678" class="connector"/>
  </g>

  <g id="admin-connectors">
    <line x1="802" y1="475" x2="605" y2="198" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="246" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="294" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="342" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="390" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="438" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="486" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="534" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="678" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="726" class="connector"/>
    <line x1="802" y1="475" x2="605" y2="774" class="connector"/>
  </g>

  <text x="500" y="900" class="caption">
    Figure: <tspan class="caption-underline">Use Case Diagram of SMARTPOULTRY</tspan>
  </text>
</svg>
