<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SMARTPOULTRY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #eef5ff 0%, #ffffff 55%, #edf6ff 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .reset-page {
            width: min(460px, calc(100vw - 32px));
            overflow: hidden;
            border: 1px solid #1f6fe5;
            border-radius: 8px;
            background: #fff;
            box-shadow: 0 24px 60px rgba(28, 84, 160, 0.16);
        }

        .reset-container {
            padding: 36px 32px;
        }

        .reset-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .reset-logo {
            width: 88px;
            height: 88px;
            display: block;
            margin: -4px auto 18px;
            border-radius: 18px;
            object-fit: contain;
            background: #fff;
            box-shadow: 0 10px 24px rgba(8, 35, 63, 0.15);
        }

        .reset-header h1 {
            margin-bottom: 6px;
            color: #08233f;
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: 0;
        }

        .reset-header p {
            margin: 0;
            color: #52627a;
            font-size: 0.86rem;
        }

        .btn-primary {
            background: #0b6ee8;
            border-color: #0b6ee8;
        }

        .form-control {
            border-color: #d8e4f5;
        }

        .small-link {
            font-size: 0.78rem;
        }
    </style>
</head>
<body>
    <div class="reset-page">
        <div class="reset-container">
            <div class="reset-header">
                <img src="{% static 'images/smartpoultry_logo.svg' %}" alt="SMARTPOULTRY logo" class="reset-logo">
                <h1>Reset Password</h1>
                <p>Enter your account email and set a new password.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <div class="mb-3">
                    <label for="new_password" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Reset Password</button>
                <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">Back to Login</a>
            </form>

            {% if error %}
                <div class="alert alert-danger mt-3">{{ error }}</div>
            {% endif %}
            {% if success %}
                <div class="alert alert-success mt-3">
                    {{ success }}
                    <div class="mt-2">
                        <a href="{% url 'login' %}" class="alert-link">Go to login</a>
                    </div>
                </div>
            {% endif %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
