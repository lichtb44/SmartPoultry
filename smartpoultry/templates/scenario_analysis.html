{% extends 'base.html' %}

{% block content %}
<div class="page-heading">
    <div>
        <h1>Scenario Analysis</h1>
        <p>Compare financial outcomes when key farm conditions change</p>
    </div>
</div>

<div class="panel-card scenario-panel"
     data-base-profit="38000"
     data-base-revenue="120000"
     data-base-expenses="82000"
     data-base-feed-cost="45000">
    <div class="panel-title">What-if Scenario Analysis</div>
    <div class="scenario-controls">
        <select class="form-select form-select-sm" data-scenario-type>
            <option value="feed_price_increase">Feed Price Increase</option>
            <option value="mortality_increase">Mortality Rate Increase</option>
            <option value="egg_price_increase">Egg Price Increase</option>
        </select>
        <input class="form-control form-control-sm" value="+10%" data-scenario-change aria-label="Scenario change">
        <button class="btn btn-primary btn-sm" type="button" data-apply-scenario>Apply</button>
    </div>
    <div class="scenario-results">
        <div><span data-scenario-label>Current Profit</span><strong data-result="profit">&#8369;38,000.00</strong></div>
        <div><span data-scenario-label>Current Revenue</span><strong data-result="revenue">&#8369;120,000.00</strong></div>
        <div><span data-scenario-label>Current Expenses</span><strong data-result="expenses">&#8369;82,000.00</strong></div>
    </div>
</div>
{% endblock %}
