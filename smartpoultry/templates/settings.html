{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Settings</h1>
            <a href="{% url 'profile' %}" class="btn btn-outline-secondary">
                <i class="bi bi-person-lines-fill"></i> Manage Profile
            </a>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="bi bi-lock me-2"></i>Password</h5>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="password">
                            <div class="mb-3">
                                <label for="current_password" class="form-label">Current Password</label>
                                <input type="password" class="form-control" id="current_password" name="current_password" required>
                            </div>
                            <div class="mb-3">
                                <label for="new_password" class="form-label">New Password</label>
                                <input type="password" class="form-control" id="new_password" name="new_password" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-key me-1"></i> Update Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-bell me-2"></i>Notifications</h5>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="notifications">
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="email_alerts" name="email_alerts" {% if preference.email_alerts %}checked{% endif %}>
                                <label class="form-check-label" for="email_alerts">Email alerts</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="email_notifications" name="email_notifications" {% if preference.email_notifications %}checked{% endif %}>
                                <label class="form-check-label" for="email_notifications">Email notifications</label>
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="in_app_notifications" name="in_app_notifications" {% if preference.in_app_notifications %}checked{% endif %}>
                                <label class="form-check-label" for="in_app_notifications">In-app notifications</label>
                            </div>
                            <div class="form-check form-switch mb-4">
                                <input class="form-check-input" type="checkbox" id="push_notifications" name="push_notifications" {% if preference.push_notifications %}checked{% endif %}>
                                <label class="form-check-label" for="push_notifications">Push notifications</label>
                            </div>
                            <button type="submit" class="btn btn-success" {% if not preference %}disabled{% endif %}>
                                <i class="bi bi-check2-circle me-1"></i> Save Settings
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
